# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  MODEL_PROVIDER: "anthropic"
  MODEL_API_KEY: ${{secrets.MODEL_API_KEY}}
  MODEL: "claude-haiku-4-5-20251001"
  EMBEDDINGS_MODEL_PROVIDER: "huggingface"
  EMBEDDINGS_MODEL_API_KEY: ${{secrets.EMBEDDINGS_MODEL_API_KEY}}
  EMBEDDINGS_MODEL: "google/embeddinggemma-300m"

permissions:
  contents: read
  code-quality: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
        #install dependencies in pyproject.toml
        pip install -e .
    - name: Lint with flake8
      run: |
        # The GitHub editor is 127 chars wide
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --indent-size=2
    - name: Test with pytest and coverage
      run: |
        pytest --cov=. --cov-report=xml
    - name: Upload coverage report
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/upload-code-coverage@v1
      with:
        file: coverage.xml
        language: Python
        label: code-coverage/pytest
